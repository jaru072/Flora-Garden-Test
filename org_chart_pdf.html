<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ผังโครงสร้างบุคลากร - โครงการรัตนบุปผา และผลิตดอกไม้ธรรมยาตรา</title>
  
  <!-- Google Fonts: Sarabun & Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- html2canvas & jsPDF for export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --font-main: 'Prompt', 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-main);
    }

    body {
      background-color: #212529;
      margin: 0;
      padding: 0;
      overflow-x: auto;
    }

    /* Fixed Top Control Bar */
    .top-control-bar {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(15, 20, 28, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    /* Outer Wrapper */
    .canvas-viewport-wrapper {
      padding: 24px 20px 80px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: calc(100vh - 70px);
    }

    /* Exact Poster Design (1600px width aspect ratio) */
    .chart-poster {
      width: 1540px;
      min-width: 1540px;
      background: #fbfbf8;
      border-radius: 4px;
      box-shadow: 0 16px 50px rgba(0,0,0,0.5);
      position: relative;
      padding: 24px 30px 30px 30px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(254, 240, 245, 0.4) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(240, 253, 244, 0.4) 0%, transparent 40%);
    }

    /* Decorative Lotus Corners */
    .lotus-decor {
      position: absolute;
      pointer-events: none;
      z-index: 1;
      width: 180px;
      height: 180px;
      opacity: 0.85;
    }
    .lotus-tl { top: -10px; left: -10px; }
    .lotus-tr { top: -10px; right: -10px; transform: scaleX(-1); }
    .lotus-bl { bottom: -10px; left: -10px; transform: scaleY(-1); }
    .lotus-br { bottom: -10px; right: -10px; transform: scale(-1); }

    /* Top Banner (Navy with Gold Accents) */
    .top-navy-banner {
      background: linear-gradient(180deg, #0d2258 0%, #08183d 100%);
      border: 2.5px solid #d4af37;
      border-radius: 40px;
      padding: 12px 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 5;
      max-width: 1100px;
      margin: 0 auto 20px auto;
      box-shadow: 0 6px 18px rgba(8, 24, 61, 0.35);
    }
    .top-navy-banner::before, .top-navy-banner::after {
      content: '❖';
      color: #ffd700;
      font-size: 22px;
      position: absolute;
    }
    .top-navy-banner::before { left: 24px; }
    .top-navy-banner::after { right: 24px; }

    .banner-title {
      color: #ffffff;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      margin: 0;
    }

    /* Executive Level Boxes */
    .exec-box {
      background: #ffffff;
      border: 1.8px solid #0d2258;
      border-radius: 12px;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      background-color: #ffffff;
    }
    .exec-box-green {
      border-color: #2e7d32;
    }

    .exec-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #0d2258;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .exec-avatar-green {
      background: #2e7d32;
    }

    .dotted-line {
      width: 180px;
      border-bottom: 1.5px dotted #9e9e9e;
      margin-top: 5px;
    }

    /* Academic Banner Card (งานวิชาการ) - Positioned above 4 Pillars */
    .academic-middle-box {
      border: 2px solid #6a1b9a;
      background: #ffffff;
      border-radius: 14px;
      padding: 6px 18px;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 14px rgba(106, 27, 154, 0.15);
      position: relative;
      z-index: 10;
    }
    .academic-tag-header {
      position: absolute;
      top: -10px;
      right: 20px;
      background: #6a1b9a;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 12px;
      border-radius: 12px;
      letter-spacing: 0.5px;
    }

    /* Section Head Box (หัวหน้าส่วนงานทั้ง 4) */
    .section-head-box {
      background: #ffffff;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border: 1.5px solid #d0d7de;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      position: relative;
    }
    .head-blue { border-color: #1976d2; background: #f4f9ff; }
    .head-pink { border-color: #d81b60; background: #fff4f7; }
    .head-orange { border-color: #f57c00; background: #fff8f0; }
    .head-green { border-color: #388e3c; background: #f4fbf4; }

    .head-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .head-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-bg-blue { background: #1976d2; }
    .avatar-bg-pink { background: #d81b60; }
    .avatar-bg-orange { background: #f57c00; }
    .avatar-bg-green { background: #388e3c; }

    .head-tag {
      position: absolute;
      top: -8px;
      right: 12px;
      font-size: 10px;
      font-weight: 700;
      padding: 0 8px;
      border-radius: 8px;
      color: #ffffff;
    }
    .tag-blue { background: #1976d2; }
    .tag-pink { background: #d81b60; }
    .tag-orange { background: #f57c00; }
    .tag-green { background: #388e3c; }

    /* Columns Grid (4 Pillars) */
    .columns-grid {
      display: grid;
      grid-template-columns: 350px 320px 380px 410px;
      gap: 14px;
      position: relative;
      z-index: 4;
    }

    /* Column Header Pill */
    .col-header-pill {
      border-radius: 16px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 17px;
      border: 1.5px solid transparent;
      margin-bottom: 10px;
    }
    .header-blue {
      background: #f0f7ff;
      border-color: #1976d2;
      color: #0d47a1;
    }
    .header-pink {
      background: #fdf2f4;
      border-color: #d81b60;
      color: #880e4f;
    }
    .header-orange {
      background: #fff8f0;
      border-color: #f57c00;
      color: #e65100;
    }
    .header-green {
      background: #f1f8f1;
      border-color: #388e3c;
      color: #1b5e20;
    }

    .pill-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      flex-shrink: 0;
    }
    .icon-blue { background: #1976d2; }
    .icon-pink { background: #d81b60; }
    .icon-orange { background: #f57c00; }
    .icon-green { background: #388e3c; }

    /* Department Cards & Sections */
    .dept-card {
      background: #ffffff;
      border-radius: 10px;
      border: 1.5px solid #d0d7de;
      padding: 10px 12px;
      margin-bottom: 12px;
      position: relative;
    }
    .dept-card-blue { border-color: #90caf9; background: #fafcff; }
    .dept-card-pink { border-color: #f48fb1; background: #fffafb; }
    .dept-card-orange { border-color: #ffcc80; background: #fffcf8; }
    .dept-card-green { border-color: #a5d6a7; background: #fafffa; }

    .dept-title-badge {
      display: inline-block;
      padding: 3px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .badge-blue { background: #1565c0; color: #ffffff; }

    /* Avatar Matrix Item (Exact as user drawing) */
    .avatar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 38px;
      margin: 2px 3px;
    }
    .avatar-circle-ph {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #eef1f6;
      border: 1.5px solid #bdc7d5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7a869a;
      font-size: 17px;
    }
    .avatar-dots {
      width: 28px;
      border-bottom: 1.5px dotted #9e9e9e;
      margin-top: 4px;
      height: 2px;
    }

    /* Thumbnail Box with Image on Left */
    .thumb-left-box {
      width: 58px;
      height: 58px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 26px;
    }

    /* SVG Lines Layer */
    .svg-hierarchy-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- Top Non-Printed Actions Bar -->
  <div class="top-control-bar d-flex align-items-center justify-content-between text-white">
    <div class="d-flex align-items-center gap-3">
      <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
        <i class="bi bi-arrow-left me-1"></i> กลับระบบหลัก
      </a>
      <div class="border-start border-secondary ps-3">
        <h6 class="mb-0 fw-bold text-warning d-flex align-items-center gap-2">
          <i class="bi bi-diagram-3-fill"></i>
          <span>ผังโครงสร้างบุคลากร (ตรงตามแบบที่ส่งให้ 100%)</span>
        </h6>
        <small class="text-white-50">จัดวางสายงานวิชาการ (นักวิชาการ) คุมสายงาน 4.2, 4.3, 4.4 พร้อมปุ่มบันทึก PDF / HD</small>
      </div>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button type="button" class="btn btn-primary rounded-pill px-3.5 py-1.5 fw-bold shadow-sm d-flex align-items-center gap-2" onclick="downloadAsPDF()" id="btnDownloadPdf">
        <i class="bi bi-file-pdf fs-5"></i>
        <span>ดาวน์โหลดเป็น PDF (A3/A4)</span>
      </button>
      <button type="button" class="btn btn-success rounded-pill px-3.5 py-1.5 fw-bold shadow-sm d-flex align-items-center gap-2" onclick="downloadAsPNG()" id="btnDownloadPng">
        <i class="bi bi-image fs-5"></i>
        <span>บันทึกเป็นรูปภาพ HD (PNG)</span>
      </button>
      <button type="button" class="btn btn-outline-light rounded-pill px-3 py-1.5 fw-semibold d-flex align-items-center gap-1.5" onclick="window.print()">
        <i class="bi bi-printer"></i>
        <span>พิมพ์</span>
      </button>
    </div>
  </div>

  <!-- Main Viewport -->
  <div class="canvas-viewport-wrapper">
    
    <div class="chart-poster" id="chartPosterArea">
      <!-- Poster rendered dynamically via JavaScript -->
    </div>

  </div>

  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function loadEmployees() {
      try {
        const stored = localStorage.getItem('app_employees');
        if (stored) return JSON.parse(stored);
      } catch (e) {}
      return [];
    }

    function renderPoster() {
      const list = loadEmployees();
      const container = document.getElementById('chartPosterArea');

      const president = list.find(e => e.position === 'ประธานโครงการ' || e.role === 'ADMIN') || null;
      const advisors = list.filter(e => e.position === 'ที่ปรึกษาโครงการ');
      const advisor1 = advisors[0] || null;
      const advisor2 = advisors[1] || null;
      const coordinator = list.find(e => e.position === 'ผู้ประสานงานโครงการ') || null;
      
      const academicList = list.filter(e => 
        e.position === 'นักวิชาการ' || 
        (e.department && e.department.includes('วิชาการ')) || 
        (e.position && e.position.includes('วิชาการ')) ||
        (e.note && e.note.includes('วิชาการ'))
      );

      const headCentral = list.find(e => 
        e.position === '4.1 หัวหน้างานส่วนกลาง' || 
        e.position === 'หัวหน้างานส่วนกลาง' || 
        ((e.department || '').includes('ส่วนกลาง') && ((e.position || '').includes('หัวหน้า') || e.role === 'MANAGER'))
      ) || null;

      const headRoseExp = list.find(e => 
        e.position === '4.2 หัวหน้างานกุหลาบ/งานทดลอง' || 
        e.position === 'หัวหน้างานกุหลาบ/งานทดลอง' || 
        e.position === 'หัวหน้างานกุหลาบ' || 
        (((e.department || '').includes('กุหลาบ') || (e.department || '').includes('ทดลอง')) && ((e.position || '').includes('หัวหน้า') || e.role === 'MANAGER'))
      ) || null;

      const headRattanabuppha = list.find(e => 
        e.position === '4.3 หัวหน้างานรัตนบุปผา' || 
        e.position === 'หัวหน้างานรัตนบุปผา' || 
        ((e.department || '').includes('รัตนบุปผา') && ((e.position || '').includes('หัวหน้า') || e.role === 'MANAGER'))
      ) || null;

      const headDhammayatra = list.find(e => 
        e.position === '4.4 หัวหน้างานธรรมยาตรา' || 
        e.position === 'หัวหน้างานธรรมยาตรา' || 
        ((e.department || '').includes('ธรรมยาตรา') && ((e.position || '').includes('หัวหน้า') || e.role === 'MANAGER'))
      ) || null;

      function getEmpsForKeywords(keywords) {
        return list.filter(e => {
          const dept = (e.department || '').toLowerCase();
          const pos = (e.position || '').toLowerCase();
          const note = (e.note || '').toLowerCase();
          return keywords.some(k => dept.includes(k) || pos.includes(k) || note.includes(k));
        });
      }

      function renderAvatarMatrix(emps) {
        let html = '<div class="d-flex flex-wrap justify-content-center align-items-center gap-1 my-1">';
        if (emps && emps.length > 0) {
          emps.forEach(emp => {
            const safeName = escapeHtml(emp.name || 'พนักงาน');
            const safeCode = escapeHtml(emp.code || emp.id || '');
            const photoUrl = emp.photoUrl || emp.photo || '';
            html += `
              <div class="avatar-item" title="[${safeCode}] ${safeName}">
                <div class="avatar-circle-ph" style="background: #e3f2fd; border-color: #90caf9; color: #1565c0; overflow: hidden;">
                  ${photoUrl ? `<img src="${photoUrl}" alt="${safeName}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.parentElement.innerHTML='<i class=\\\'bi bi-person-fill text-primary\\\'></i>'" />` : `<i class="bi bi-person-fill text-primary"></i>`}
                </div>
                <div style="font-size: 11px; font-weight: 600; text-align: center; max-width: 48px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${safeName}</div>
                <div class="avatar-dots"></div>
              </div>
            `;
          });
        } else {
          html += `
            <div class="avatar-item">
              <div class="avatar-circle-ph"><i class="bi bi-person"></i></div>
              <div style="font-size: 10px; color: #9e9e9e;">ว่าง</div>
              <div class="avatar-dots"></div>
            </div>
          `;
        }
        html += '</div>';
        return html;
      }

      const empsAdmin = getEmpsForKeywords(['ธุรการ', 'บุคคล']);
      const empsWelfare = getEmpsForKeywords(['สวัสดิการ']);
      const empsWater = getEmpsForKeywords(['ระบบน้ำ', 'น้ำ']);
      const empsGrass = getEmpsForKeywords(['ตัดหญ้า', 'หญ้า', 'สนับสนุน']);
      const empsExp = getEmpsForKeywords(['ทดลอง', 'วิจัย']);
      const empsRose = getEmpsForKeywords(['กุหลาบ']);
      const empsChedi = getEmpsForKeywords(['เจดีย์', 'แปลง g']);
      const empsVihara = getEmpsForKeywords(['วิหารหลวงปู่', 'วิหาร']);
      const empsRoad = getEmpsForKeywords(['ถนน', 'ธรรมชัย', 'เฟื่องฟ้า']);
      const empsSoil = getEmpsForKeywords(['ผสมแกลบ', 'โต๊ะกลาง', 'ผสมดิน', 'แกลบ']);
      const empsPlotsAB = getEmpsForKeywords(['แปลง a', 'แปลง b', 'แปลง a-b', 'แปลง a / b']);
      const empsPlotsEP11 = getEmpsForKeywords(['แปลง e', 'p11', 'แปลง e / p11']);
      const empsPotPlants = getEmpsForKeywords(['วิหารคด', 'ไม้กระถาง', '13-20', 'ปอ']);

      container.innerHTML = `
        <!-- Lotus Background Decors in Corners -->
        <svg class="lotus-decor lotus-tl" viewBox="0 0 100 100">
          <path d="M50,10 C45,30 20,40 5,50 C20,60 45,70 50,90 C55,70 80,60 95,50 C80,40 55,30 50,10 Z" fill="#fce4ec" opacity="0.65"/>
          <circle cx="50" cy="50" r="10" fill="#ffd54f" opacity="0.85"/>
        </svg>
        <svg class="lotus-decor lotus-tr" viewBox="0 0 100 100">
          <path d="M50,10 C45,30 20,40 5,50 C20,60 45,70 50,90 C55,70 80,60 95,50 C80,40 55,30 50,10 Z" fill="#fce4ec" opacity="0.65"/>
          <circle cx="50" cy="50" r="10" fill="#ffd54f" opacity="0.85"/>
        </svg>
        <svg class="lotus-decor lotus-bl" viewBox="0 0 100 100">
          <path d="M50,10 C45,30 20,40 5,50 C20,60 45,70 50,90 C55,70 80,60 95,50 C80,40 55,30 50,10 Z" fill="#fce4ec" opacity="0.65"/>
          <circle cx="50" cy="50" r="10" fill="#ffd54f" opacity="0.85"/>
        </svg>
        <svg class="lotus-decor lotus-br" viewBox="0 0 100 100">
          <path d="M50,10 C45,30 20,40 5,50 C20,60 45,70 50,90 C55,70 80,60 95,50 C80,40 55,30 50,10 Z" fill="#fce4ec" opacity="0.65"/>
          <circle cx="50" cy="50" r="10" fill="#ffd54f" opacity="0.85"/>
        </svg>

        <!-- SVG Hierarchy Connecting Lines -->
        <svg class="svg-hierarchy-lines" viewBox="0 0 1540 1000" preserveAspectRatio="none">
          <line x1="770" y1="120" x2="770" y2="145" stroke="#0d2258" stroke-width="2" />
          <line x1="460" y1="145" x2="1080" y2="145" stroke="#0d2258" stroke-width="2" />
          <line x1="460" y1="145" x2="460" y2="160" stroke="#0d2258" stroke-width="2" />
          <line x1="1080" y1="145" x2="1080" y2="160" stroke="#0d2258" stroke-width="2" />
          <line x1="770" y1="145" x2="770" y2="230" stroke="#0d2258" stroke-width="2" />
          
          <!-- 3. Coordinator directly to 1. งานส่วนกลาง -->
          <path d="M 770 260 L 175 260 L 175 425" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-linejoin="round" />

          <!-- 4. Coordinator to Academic Box -->
          <line x1="770" y1="290" x2="770" y2="330" stroke="#6a1b9a" stroke-width="2" />

          <!-- 5. Academic Box branching down to 3 Sections: 2. งานกุหลาบ/งานทดลอง, 3. งานรัตนบุปผา, 4. งานธรรมยาตรา -->
          <line x1="770" y1="390" x2="770" y2="410" stroke="#6a1b9a" stroke-width="2.5" />
          <line x1="515" y1="410" x2="1335" y2="410" stroke="#6a1b9a" stroke-width="2.5" />

          <!-- Drop lines to Section 2, 3, 4 -->

    // Export High-Resolution PNG
    async function downloadAsPNG() {
      const btn = document.getElementById('btnDownloadPng');
      const origText = btn.innerHTML;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> กำลังสร้างรูปภาพ HD...';
      btn.disabled = true;

      try {
        const poster = document.getElementById('chartPosterArea');
        const canvas = await html2canvas(poster, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#fbfbf8',
          logging: false
        });

        const link = document.createElement('a');
        link.download = 'โครงสร้างบุคลากร_โครงการรัตนบุปผา_ธรรมยาตรา_HD.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        console.error(err);
        alert('เกิดข้อผิดพลาดในการสร้างรูปภาพ กรุณาลองใหม่อีกครั้ง');
      } finally {
        btn.innerHTML = origText;
        btn.disabled = false;
      }
    }

    // Export Vector/Landscape PDF
    async function downloadAsPDF() {
      const btn = document.getElementById('btnDownloadPdf');
      const origText = btn.innerHTML;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> กำลังสร้างไฟล์ PDF...';
      btn.disabled = true;

      try {
        const poster = document.getElementById('chartPosterArea');
        const canvas = await html2canvas(poster, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#fbfbf8',
          logging: false
        });

        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        const { jsPDF } = window.jspdf;
        
        // A3 Landscape Dimensions (420 x 297 mm)
        const pdf = new jsPDF({
          orientation: 'landscape',
          unit: 'mm',
          format: 'a3'
        });

        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = pdf.internal.pageSize.getHeight();
        
        const margin = 8;
        const targetWidth = pdfWidth - (margin * 2);
        const targetHeight = (canvas.height * targetWidth) / canvas.width;

        pdf.addImage(imgData, 'JPEG', margin, (pdfHeight - targetHeight) / 2, targetWidth, targetHeight);
        pdf.save('โครงสร้างบุคลากร_โครงการรัตนบุปผา_ธรรมยาตรา.pdf');
      } catch (err) {
        console.error(err);
        alert('เกิดข้อผิดพลาดในการสร้าง PDF กรุณาลองใหม่อีกครั้ง');
      } finally {
        btn.innerHTML = origText;
        btn.disabled = false;
      }
    }
